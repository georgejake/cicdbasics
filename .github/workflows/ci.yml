name: CI - Build and Push Docker Image   # Name shown in GitHub Actions tab

on:
  push:
    branches:
      - main               # Triggers only when code lands on main (i.e your PR merge)

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — existing CI job 
  # ─────────────────────────────────────────
  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest       # GitHub spins up a fresh Ubuntu VM for this job

    steps:

      # Step 1: Checkout your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v3

      # ---- Python + uv + pytest ----

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5  # official uv GitHub Action

      - name: Install dependencies
        run: uv sync --all-extras  # reads your pyproject.toml + uv.lock and installs everything

      - name: Run pytest
        run: uv run pytest tests/ -v # runs pytest inside uv's managed environment

      # Step 2: Log in to DockerHub using your secrets
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx        # ← new step added here
        uses: docker/setup-buildx-action@v3
        
      # Step 3: Build and Push in one shot
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .                          # Dockerfile is at repo root
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mydockerexp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mydockerexp:${{ github.sha }}
          cache-from: type=gha        # ← restore cache from GitHub Actions storage
          cache-to: type=gha,mode=max # ← save cache back after build
  # ─────────────────────────────────────────
  # JOB 2 — CD, deploy to ECS via Terraform
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to ECS via Terraform
    runs-on: ubuntu-latest
    needs: build-and-push       # ← only runs if Job 1 succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: terraform init

      - name: Terraform Apply
        working-directory: infra/
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_dockerhub_image: ${{ secrets.DOCKERHUB_USERNAME }}/mydockerexp:${{ github.sha }}
        run: terraform apply -auto-approve